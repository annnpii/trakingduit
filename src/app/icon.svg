<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TrackingDuit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a2d" />
      <stop offset="1" stop-color="#04140f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a8" />
      <stop offset="1" stop-color="#8df3d1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- rising trend -->
  <polyline
    points="120,300 196,236 268,270 344,150"
    fill="none"
    stroke="url(#accent)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="344" cy="150" r="26" fill="#8df3d1" />

  <!-- coin stack -->
  <ellipse cx="256" cy="408" rx="92" ry="30" fill="#2ee6a8" opacity="0.22" />
  <ellipse cx="256" cy="384" rx="92" ry="30" fill="#2ee6a8" opacity="0.45" />
  <ellipse cx="256" cy="360" rx="92" ry="30" fill="url(#accent)" />
  <text
    x="256"
    y="374"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="bold"
    text-anchor="middle"
    fill="#04140f"
  >Rp</text>
</svg>
